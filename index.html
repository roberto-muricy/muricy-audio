<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muricy Audio</title>
    <style>
      :root { --bg: #ffffff; --text: #1a1c20; --muted: #5b6070; --accent: #1f8a5b; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0f1115; --text: #eceef2; --muted: #9aa0ad; --accent: #4cd98f; }
      }
      body { margin: 0; background: var(--bg); color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 28px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 24px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Muricy Audio</h1>
      <p>Apps para músicos.</p>
      <h2>Unisono</h2>
      <ul>
        <li><a href="unisono/privacy/">Política de Privacidade / Privacy Policy / Política de Privacidad</a></li>
      </ul>
    </main>
  </body>
</html>
